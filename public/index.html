<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Empfang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #kiosk-root, #kiosk-root * { box-sizing: border-box; }
  #kiosk-root {
    --ink: #1B2430;
    --paper: #F4F0E6;
    --paper-2: #EAE3D3;
    --amber: #D98E3D;
    --amber-deep: #B9701F;
    --teal: #3E7075;
    --teal-deep: #2C5257;
    --line: #D8CFB8;
    --danger: #B3492F;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(217,142,61,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(62,112,117,0.14), transparent 45%);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  }
  #kiosk-root .display { font-family: 'Space Grotesk', sans-serif; }
  #kiosk-root .card { width: 100%; max-width: 480px; background: var(--paper); border-radius: 18px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04); overflow: hidden; }
  #kiosk-root[data-rolle="handwerker"] .fortschritt .punkt[data-erledigt="true"] { background: var(--teal); }
  #kiosk-root .top { padding: 26px 28px 0 28px; }
  #kiosk-root .eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #7A7263; margin: 0 0 4px 0; font-weight: 600; }
  #kiosk-root h1 { font-size: 23px; margin: 0 0 18px 0; letter-spacing: -0.01em; line-height: 1.25; }
  #kiosk-root .fortschritt { display: flex; gap: 6px; padding: 0 28px; margin-bottom: 18px; }
  #kiosk-root .fortschritt .punkt { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  #kiosk-root .fortschritt .punkt[data-erledigt="true"] { background: var(--amber); }

  #kiosk-root .rollen { display: flex; flex-direction: column; gap: 10px; padding: 0 28px 28px 28px; }
  #kiosk-root .rollen-btn { padding: 18px 16px; border-radius: 14px; border: 2px solid var(--line); background: #fff;
    font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  #kiosk-root .rollen-btn .titel { font-weight: 700; font-size: 16px; }
  #kiosk-root .rollen-btn .sub { font-size: 12px; color: #8A8272; }
  #kiosk-root .rollen-btn:active { transform: scale(0.98); }
  #kiosk-root .rollen-btn.leise { border-style: dashed; }

  #kiosk-root form, #kiosk-root .step-body { padding: 0 28px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
  #kiosk-root label { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: #5C5647; display: block; margin-bottom: 6px; }
  #kiosk-root input, #kiosk-root select { width: 100%; padding: 13px 14px; border-radius: 9px; border: 1.5px solid var(--line);
    background: #FFFFFF; font-family: inherit; font-size: 16px; color: var(--ink); }
  #kiosk-root input:focus, #kiosk-root select:focus { outline: none; border-color: var(--amber-deep); }
  #kiosk-root[data-rolle="handwerker"] input:focus { border-color: var(--teal-deep); }

  #kiosk-root .wahl-row { display: flex; gap: 10px; padding: 0 28px 20px 28px; }
  #kiosk-root .wahl-row button { flex: 1; padding: 18px; border-radius: 12px; border: 2px solid var(--line);
    background: #fff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; color: #6B6355; }
  #kiosk-root .wahl-row button:active { transform: scale(0.98); }

  #kiosk-root .step-nav { display: flex; gap: 10px; padding: 0 28px 28px 28px; }
  #kiosk-root .zurueck-btn { flex: 0 0 auto; padding: 15px 18px; border-radius: 10px; border: 2px solid var(--line);
    background: transparent; font-family: inherit; font-weight: 700; cursor: pointer; color: #6B6355; }
  #kiosk-root .weiter-btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer; color: #2A1C0B; background: var(--amber); }
  #kiosk-root[data-rolle="handwerker"] .weiter-btn { color: #EAF4F4; background: var(--teal); }
  #kiosk-root .weiter-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  #kiosk-root .review-zeile { display: flex; justify-content: space-between; gap: 10px; font-size: 14px;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed var(--line); }
  #kiosk-root .review-zeile span:first-child { color: #8A8272; flex-shrink: 0; }
  #kiosk-root .review-zeile span:last-child { text-align: right; font-weight: 600; }

  #kiosk-root .liste { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
  #kiosk-root .liste-item { padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff;
    text-align: left; cursor: pointer; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #kiosk-root .liste-item .n { font-weight: 700; font-size: 15px; }
  #kiosk-root .liste-item .s { font-size: 12px; color: #8A8272; }
  #kiosk-root .liste-item .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px;
    border-radius: 999px; background: var(--paper-2); color: #6B6355; flex-shrink: 0; }
  #kiosk-root .leer { padding: 24px; text-align: center; color: #8A8272; font-size: 14px; }

  #kiosk-root .toggle-zeile { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  #kiosk-root .toggle-zeile input { width: auto; }

  #kiosk-root .error { color: var(--danger); font-size: 13px; margin: -6px 0 0 0; min-height: 16px; padding: 0 28px; }

  #kiosk-root .confirm { padding: 56px 28px 52px 28px; text-align: center; }
  #kiosk-root .confirm .stamp { width: 64px; height: 64px; border-radius: 50%; background: var(--amber);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px auto; font-size: 30px; color: #2A1C0B; }
  #kiosk-root[data-rolle="handwerker"] .confirm .stamp { background: var(--teal); color: #EAF4F4; }
  #kiosk-root .confirm h2 { font-size: 21px; margin: 0 0 6px 0; }
  #kiosk-root .confirm p { font-size: 14px; color: #7A7263; margin: 0; }
</style>
</head>
<body>
<div id="kiosk-root"></div>

<!-- KIOSK_API_KEY, Standort, Hintergrund und Willkommenstext werden serverseitig eingesetzt -->
<script>window.KIOSK_CONFIG = { apiKey: "__KIOSK_API_KEY__", standort: "__STANDORT__", hintergrundUrl: "__HINTERGRUND_URL__", willkommenstext: "__WILLKOMMENSTEXT__" };</script>

<script>
(function() {
  const root = document.getElementById('kiosk-root');

  if (window.KIOSK_CONFIG.hintergrundUrl) {
    root.style.backgroundImage = `linear-gradient(rgba(27,36,48,0.55), rgba(27,36,48,0.78)), url('${window.KIOSK_CONFIG.hintergrundUrl}')`;
    root.style.backgroundSize = 'cover';
    root.style.backgroundPosition = 'center';
  }

  function leererState() {
    return {
      rolle: null,
      stepIndex: 0,
      standort: window.KIOSK_CONFIG.standort,
      name: '', firma: '', ansprechpartner: '', grund: '',
      brauchtSchluessel: null, schluessel: '',
      offeneEintraege: [], offeneLoading: false, offeneGeladen: false,
      ausgewaehlt: null, schluesselZurueck: true,
      submitting: false, error: '', fertig: null
    };
  }
  let state = leererState();

  function currentSteps() {
    if (state.rolle === 'besucher') return ['name', 'firma', 'details', 'review'];
    if (state.rolle === 'handwerker') {
      const s = ['name', 'firma', 'schluessel-frage'];
      if (state.brauchtSchluessel === 'ja') s.push('schluessel-name');
      s.push('review');
      return s;
    }
    return [];
  }

  function render() {
    root.dataset.rolle = state.rolle || '';
    if (state.fertig) return renderFertig();
    if (state.rolle === 'abmelden') return renderAbmelden();
    if (!state.rolle) return renderStart();
    return renderWizard();
  }

  function cardShell(innerHtml) {
    root.innerHTML = `<div class="card">${innerHtml}</div>`;
  }

  function renderStart() {
    cardShell(`
      <div class="top">
        <p class="eyebrow">Empfang — ${escapeHtml(state.standort)}</p>
        <h1 class="display">${escapeHtml(window.KIOSK_CONFIG.willkommenstext || 'Willkommen!')}</h1>
      </div>
      <div class="rollen">
        <button type="button" class="rollen-btn" data-rolle="besucher">
          <span class="titel">Ich bin Besucher</span>
          <span class="sub">Neu anmelden</span>
        </button>
        <button type="button" class="rollen-btn" data-rolle="handwerker">
          <span class="titel">Ich bin Handwerker</span>
          <span class="sub">Neu anmelden, ggf. mit Schlüssel</span>
        </button>
        <button type="button" class="rollen-btn leise" data-rolle="abmelden">
          <span class="titel">Ich möchte mich abmelden</span>
          <span class="sub">Für bereits angemeldete Besucher &amp; Handwerker</span>
        </button>
      </div>
    `);
    root.querySelectorAll('.rollen-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.rolle = btn.dataset.rolle;
        state.stepIndex = 0;
        render();
      });
    });
  }

  function fortschrittHtml(steps) {
    return `<div class="fortschritt">${steps.map((_, i) => `<div class="punkt" data-erledigt="${i <= state.stepIndex}"></div>`).join('')}</div>`;
  }

  function renderWizard() {
    const steps = currentSteps();
    if (state.stepIndex >= steps.length) state.stepIndex = steps.length - 1;
    const step = steps[state.stepIndex];
    const istLetzter = state.stepIndex === steps.length - 1;

    let titel = '';
    let body = '';
    let weiterAktiv = true;
    let weiterText = 'Weiter';
    let weiterAktion = 'weiter';

    if (step === 'name') {
      titel = state.rolle === 'besucher' ? 'Wie ist Ihr Name?' : 'Wie ist Ihr Name?';
      body = `<div><label for="f-name">Vor- und Nachname</label><input id="f-name" value="${escapeAttr(state.name)}" placeholder="Max Mustermann" autocomplete="off" /></div>`;
      weiterAktiv = !!state.name.trim();
    } else if (step === 'firma') {
      titel = 'Für welche Firma sind Sie hier?';
      body = `<div><label for="f-firma">Firma (optional)</label><input id="f-firma" value="${escapeAttr(state.firma)}" placeholder="Firma GmbH" autocomplete="off" /></div>`;
      weiterAktiv = true;
    } else if (step === 'details') {
      titel = 'Wen möchten Sie besuchen?';
      body = `
        <div><label for="f-ansprechpartner">Ansprechperson</label><input id="f-ansprechpartner" value="${escapeAttr(state.ansprechpartner)}" placeholder="Name der Ansprechperson" autocomplete="off" /></div>
        <div><label for="f-grund">Grund des Besuchs (optional)</label><input id="f-grund" value="${escapeAttr(state.grund)}" placeholder="z. B. Meeting, Lieferung" autocomplete="off" /></div>
      `;
      weiterAktiv = !!state.ansprechpartner.trim();
    } else if (step === 'schluessel-frage') {
      titel = 'Brauchen Sie einen Schlüssel?';
      root.dataset.rolle = 'handwerker';
      cardShell(`
        <div class="top">${fortschrittHtml(steps)}<h1 class="display">${titel}</h1></div>
        <div class="wahl-row">
          <button type="button" id="btn-nein">Nein</button>
          <button type="button" id="btn-ja">Ja</button>
        </div>
        <div class="step-nav"><button type="button" class="zurueck-btn" id="btn-zurueck">Zurück</button></div>
      `);
      root.querySelector('#btn-ja').addEventListener('click', () => { state.brauchtSchluessel = 'ja'; state.stepIndex++; render(); });
      root.querySelector('#btn-nein').addEventListener('click', () => { state.brauchtSchluessel = 'nein'; state.schluessel = ''; state.stepIndex++; render(); });
      root.querySelector('#btn-zurueck').addEventListener('click', () => goBack());
      return;
    } else if (step === 'schluessel-name') {
      titel = 'Welchen Schlüssel benötigen Sie?';
      body = `<div><label for="f-schluessel">Schlüssel / Objekt</label><input id="f-schluessel" value="${escapeAttr(state.schluessel)}" placeholder="z. B. Keller, Raum 2.14" autocomplete="off" /></div>`;
      weiterAktiv = !!state.schluessel.trim();
    } else if (step === 'review') {
      titel = 'Bitte prüfen';
      const zeilen = [['Name', state.name], ['Firma', state.firma || '—']];
      if (state.rolle === 'besucher') { zeilen.push(['Ansprechperson', state.ansprechpartner]); zeilen.push(['Grund', state.grund || '—']); }
      if (state.rolle === 'handwerker') { zeilen.push(['Schlüssel', state.brauchtSchluessel === 'ja' ? state.schluessel : 'nicht benötigt']); }
      body = zeilen.map(([k, v]) => `<div class="review-zeile"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('');
      weiterText = state.submitting ? 'Wird gespeichert…' : 'Anmeldung abschicken';
      weiterAktion = 'absenden';
      weiterAktiv = !state.submitting;
    }

    cardShell(`
      <div class="top">${fortschrittHtml(steps)}<h1 class="display">${titel}</h1></div>
      <form id="wizard-form" novalidate>${body}</form>
      <p class="error">${escapeHtml(state.error)}</p>
      <div class="step-nav">
        <button type="button" class="zurueck-btn" id="btn-zurueck">Zurück</button>
        <button type="button" class="weiter-btn" id="btn-weiter" ${weiterAktiv ? '' : 'disabled'}>${weiterText}</button>
      </div>
    `);

    const nameInput = root.querySelector('#f-name');
    if (nameInput) nameInput.addEventListener('input', e => { state.name = e.target.value; syncWeiterButton(); });
    const firmaInput = root.querySelector('#f-firma');
    if (firmaInput) firmaInput.addEventListener('input', e => { state.firma = e.target.value; });
    const apInput = root.querySelector('#f-ansprechpartner');
    if (apInput) apInput.addEventListener('input', e => { state.ansprechpartner = e.target.value; syncWeiterButton(); });
    const grundInput = root.querySelector('#f-grund');
    if (grundInput) grundInput.addEventListener('input', e => { state.grund = e.target.value; });
    const schluesselInput = root.querySelector('#f-schluessel');
    if (schluesselInput) schluesselInput.addEventListener('input', e => { state.schluessel = e.target.value; syncWeiterButton(); });

    root.querySelector('#btn-zurueck').addEventListener('click', () => goBack());
    root.querySelector('#btn-weiter').addEventListener('click', () => {
      if (weiterAktion === 'absenden') { submitAnmeldung(); return; }
      state.error = '';
      state.stepIndex++;
      render();
    });
  }

  function syncWeiterButton() {
    const steps = currentSteps();
    const step = steps[state.stepIndex];
    const btn = root.querySelector('#btn-weiter');
    if (!btn) return;
    let aktiv = true;
    if (step === 'name') aktiv = !!state.name.trim();
    if (step === 'details') aktiv = !!state.ansprechpartner.trim();
    if (step === 'schluessel-name') aktiv = !!state.schluessel.trim();
    btn.disabled = !aktiv;
  }

  function goBack() {
    state.error = '';
    if (state.stepIndex > 0) { state.stepIndex--; render(); return; }
    state = leererState();
    render();
  }

  async function submitAnmeldung() {
    state.submitting = true; state.error = ''; render();
    const endpoint = state.rolle === 'besucher' ? '/api/besucher' : '/api/handwerker';
    const body = { standort: state.standort, name: state.name.trim(), firma: state.firma.trim() || null };
    if (state.rolle === 'besucher') { body.ansprechpartner = state.ansprechpartner.trim(); body.grund = state.grund.trim() || null; }
    if (state.rolle === 'handwerker') { body.schluessel = state.brauchtSchluessel === 'ja' ? state.schluessel.trim() : null; }

    let ok = false, serverError = '';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': window.KIOSK_CONFIG.apiKey },
        body: JSON.stringify(body)
      });
      ok = res.ok;
      if (!ok) { const b = await res.json().catch(() => ({})); serverError = b.error || ''; }
    } catch (e) { ok = false; }

    if (!ok) {
      state.submitting = false;
      state.error = serverError || 'Speichern fehlgeschlagen. Bitte erneut versuchen oder am Empfang melden.';
      render();
      return;
    }

    const name = state.name.trim();
    const rolle = state.rolle;
    state = leererState();
    state.fertig = { art: 'anmeldung', rolle, name };
    render();
  }

  // --- Abmeldung ------------------------------------------------------------

  async function renderAbmelden() {
    if (!state.offeneGeladen && !state.offeneLoading) {
      state.offeneLoading = true;
      cardShell(`<div class="top"><p class="eyebrow">Abmeldung</p><h1 class="display">Wer möchte sich abmelden?</h1></div><div class="step-body"><p class="leer">Lädt…</p></div>`);
      try {
        const res = await fetch(`/api/checkins/offene-liste?standort=${encodeURIComponent(state.standort)}`, {
          headers: { 'x-api-key': window.KIOSK_CONFIG.apiKey }
        });
        state.offeneEintraege = res.ok ? await res.json() : [];
      } catch (e) { state.offeneEintraege = []; }
      state.offeneLoading = false;
      state.offeneGeladen = true;
      render();
      return;
    }

    if (!state.ausgewaehlt) {
      const liste = state.offeneEintraege.length
        ? `<div class="liste">${state.offeneEintraege.map(e => `
            <button type="button" class="liste-item" data-id="${e.id}" data-typ="${e.typ}">
              <span><span class="n">${escapeHtml(e.name)}</span><br/><span class="s">${escapeHtml(e.firma || '—')}</span></span>
              <span class="badge">${e.typ === 'besucher' ? 'Besucher' : 'Handwerker'}</span>
            </button>
          `).join('')}</div>`
        : `<p class="leer">Aktuell ist niemand als anwesend erfasst.</p>`;
      cardShell(`
        <div class="top"><p class="eyebrow">Abmeldung — ${escapeHtml(state.standort)}</p><h1 class="display">Wer möchte sich abmelden?</h1></div>
        <div class="step-body">${liste}</div>
        <div class="step-nav"><button type="button" class="zurueck-btn" id="btn-zurueck">Zurück</button></div>
      `);
      root.querySelectorAll('.liste-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const eintrag = state.offeneEintraege.find(e => String(e.id) === btn.dataset.id && e.typ === btn.dataset.typ);
          state.ausgewaehlt = eintrag;
          render();
        });
      });
      root.querySelector('#btn-zurueck').addEventListener('click', () => { state = leererState(); render(); });
      return;
    }

    const hatOffenenSchluessel = state.ausgewaehlt.typ === 'handwerker' && !!state.ausgewaehlt.schluessel;
    cardShell(`
      <div class="top"><p class="eyebrow">Abmeldung</p><h1 class="display">Auf Wiedersehen, ${escapeHtml(state.ausgewaehlt.name)}?</h1></div>
      <div class="step-body">
        ${hatOffenenSchluessel ? `
          <div class="review-zeile"><span>Schlüssel</span><span>${escapeHtml(state.ausgewaehlt.schluessel)}</span></div>
          <div class="toggle-zeile"><input type="checkbox" id="chk-zurueck" ${state.schluesselZurueck ? 'checked' : ''} /><label for="chk-zurueck" style="margin:0">Schlüssel jetzt zurückgeben</label></div>
        ` : ''}
      </div>
      <p class="error">${escapeHtml(state.error)}</p>
      <div class="step-nav">
        <button type="button" class="zurueck-btn" id="btn-zurueck">Zurück</button>
        <button type="button" class="weiter-btn" id="btn-bestaetigen">${state.submitting ? 'Wird gespeichert…' : 'Abmelden'}</button>
      </div>
    `);
    const chk = root.querySelector('#chk-zurueck');
    if (chk) chk.addEventListener('change', e => { state.schluesselZurueck = e.target.checked; });
    root.querySelector('#btn-zurueck').addEventListener('click', () => { state.ausgewaehlt = null; render(); });
    root.querySelector('#btn-bestaetigen').addEventListener('click', () => submitAbmeldung());
  }

  async function submitAbmeldung() {
    state.submitting = true; state.error = ''; render();
    const { id, typ, name } = state.ausgewaehlt;
    let ok = false, serverError = '';
    try {
      const res = await fetch(`/api/checkins/${typ}/${id}/abmelden`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-api-key': window.KIOSK_CONFIG.apiKey },
        body: JSON.stringify({ standort: state.standort, schluessel_zurueck: state.schluesselZurueck })
      });
      ok = res.ok;
      if (!ok) { const b = await res.json().catch(() => ({})); serverError = b.error || ''; }
    } catch (e) { ok = false; }

    if (!ok) {
      state.submitting = false;
      state.error = serverError || 'Abmelden fehlgeschlagen. Bitte erneut versuchen oder am Empfang melden.';
      render();
      return;
    }

    state = leererState();
    state.fertig = { art: 'abmeldung', name };
    render();
  }

  // --- Abschluss --------------------------------------------------------------

  function renderFertig() {
    const f = state.fertig;
    const titel = f.art === 'abmeldung' ? `Auf Wiedersehen, ${escapeHtml(f.name)}!` : `Danke, ${escapeHtml(f.name)}!`;
    const text = f.art === 'abmeldung'
      ? 'Ihre Abmeldung wurde erfasst.'
      : (f.rolle === 'besucher' ? 'Ihre Anmeldung wurde übermittelt.' : 'Ihre Anmeldung wurde erfasst.');
    cardShell(`<div class="confirm"><div class="stamp">✓</div><h2 class="display">${titel}</h2><p>${text}</p></div>`);
    setTimeout(() => { state = leererState(); render(); }, 4000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }

  render();
})();
</script>
</body>
</html>
