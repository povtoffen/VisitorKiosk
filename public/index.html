<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Empfang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #kiosk-root, #kiosk-root * { box-sizing: border-box; }
  #kiosk-root {
    --ink: #1B2430;
    --paper: #F4F0E6;
    --paper-2: #EAE3D3;
    --amber: #D98E3D;
    --amber-deep: #B9701F;
    --teal: #3E7075;
    --teal-deep: #2C5257;
    --line: #D8CFB8;
    --danger: #B3492F;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(217,142,61,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(62,112,117,0.14), transparent 45%);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  }
  #kiosk-root .display { font-family: 'Space Grotesk', sans-serif; }
  #kiosk-root .card { width: 100%; max-width: 480px; background: var(--paper); border-radius: 18px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04); overflow: hidden; }
  #kiosk-root .top { padding: 26px 28px 0 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #kiosk-root .eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #7A7263; margin: 0 0 4px 0; font-weight: 600; }
  #kiosk-root h1 { font-size: 23px; margin: 0 0 18px 0; letter-spacing: -0.01em; line-height: 1.25; }

  #kiosk-root .sprache-schalter { display: flex; gap: 4px; flex-shrink: 0; }
  #kiosk-root .sprache-schalter button { padding: 6px 10px; border-radius: 7px; border: 1.5px solid var(--line);
    background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; color: #8A8272; }
  #kiosk-root .sprache-schalter button[data-active="true"] { background: var(--paper-2); color: var(--ink); border-color: var(--ink); }

  #kiosk-root .fortschritt { display: flex; gap: 6px; padding: 0 28px; margin-bottom: 18px; }
  #kiosk-root .fortschritt .punkt { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  #kiosk-root .fortschritt .punkt[data-erledigt="true"] { background: var(--amber); }
  #kiosk-root[data-rolle="handwerker"] .fortschritt .punkt[data-erledigt="true"] { background: var(--teal); }

  #kiosk-root .rollen { display: flex; flex-direction: column; gap: 10px; padding: 0 28px 28px 28px; }
  #kiosk-root .rollen-btn { padding: 18px 16px; border-radius: 14px; border: 2px solid var(--line); background: #fff;
    font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  #kiosk-root .rollen-btn .titel { font-weight: 700; font-size: 16px; }
  #kiosk-root .rollen-btn .sub { font-size: 12px; color: #8A8272; }
  #kiosk-root .rollen-btn:active { transform: scale(0.98); }
  #kiosk-root .rollen-btn.leise { border-style: dashed; }

  #kiosk-root form, #kiosk-root .step-body { padding: 0 28px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
  #kiosk-root label { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: #5C5647; display: block; margin-bottom: 6px; }
  #kiosk-root input, #kiosk-root select { width: 100%; padding: 13px 14px; border-radius: 9px; border: 1.5px solid var(--line);
    background: #FFFFFF; font-family: inherit; font-size: 16px; color: var(--ink); }
  #kiosk-root input:focus, #kiosk-root select:focus { outline: none; border-color: var(--amber-deep); }
  #kiosk-root[data-rolle="handwerker"] input:focus { border-color: var(--teal-deep); }

  #kiosk-root .wahl-row { display: flex; gap: 10px; padding: 0 28px 20px 28px; }
  #kiosk-root .wahl-row button { flex: 1; padding: 18px; border-radius: 12px; border: 2px solid var(--line);
    background: #fff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; color: #6B6355; }
  #kiosk-root .wahl-row button:active { transform: scale(0.98); }

  #kiosk-root .step-nav { display: flex; gap: 10px; padding: 0 28px 28px 28px; }
  #kiosk-root .zurueck-btn { flex: 0 0 auto; padding: 15px 18px; border-radius: 10px; border: 2px solid var(--line);
    background: transparent; font-family: inherit; font-weight: 700; cursor: pointer; color: #6B6355; }
  #kiosk-root .weiter-btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer; color: #2A1C0B; background: var(--amber); }
  #kiosk-root[data-rolle="handwerker"] .weiter-btn { color: #EAF4F4; background: var(--teal); }
  #kiosk-root .weiter-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  #kiosk-root .review-zeile { display: flex; justify-content: space-between; gap: 10px; font-size: 14px;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed var(--line); }
  #kiosk-root .review-zeile span:first-child { color: #8A8272; flex-shrink: 0; }
  #kiosk-root .review-zeile span:last-child { text-align: right; font-weight: 600; }

  #kiosk-root .suchfeld { padding: 0 28px 14px 28px; }
  #kiosk-root .such-hinweis { padding: 10px 28px 24px 28px; color: #8A8272; font-size: 13px; text-align: center; margin: 0; }
  #kiosk-root .liste { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding: 0 28px 20px 28px; }
  #kiosk-root .liste-item { padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff;
    text-align: left; cursor: pointer; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #kiosk-root .liste-item .n { font-weight: 700; font-size: 15px; }
  #kiosk-root .liste-item .s { font-size: 12px; color: #8A8272; }
  #kiosk-root .liste-item .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px;
    border-radius: 999px; background: var(--paper-2); color: #6B6355; flex-shrink: 0; }

  #kiosk-root .toggle-zeile { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  #kiosk-root .toggle-zeile input { width: auto; }

  #kiosk-root .error { color: var(--danger); font-size: 13px; margin: -6px 0 0 0; min-height: 16px; padding: 0 28px; }

  #kiosk-root .confirm { padding: 56px 28px 52px 28px; text-align: center; }
  #kiosk-root .confirm .stamp { width: 64px; height: 64px; border-radius: 50%; background: var(--amber);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px auto; font-size: 30px; color: #2A1C0B; }
  #kiosk-root[data-rolle="handwerker"] .confirm .stamp { background: var(--teal); color: #EAF4F4; }
  #kiosk-root .confirm h2 { font-size: 21px; margin: 0 0 6px 0; }
  #kiosk-root .confirm p { font-size: 14px; color: #7A7263; margin: 0; }
</style>
</head>
<body>
<div id="kiosk-root"></div>

<!-- KIOSK_API_KEY, Standort, Hintergrund und Willkommenstext werden serverseitig eingesetzt -->
<script>window.KIOSK_CONFIG = { apiKey: "__KIOSK_API_KEY__", standort: "__STANDORT__", hintergrundUrl: "__HINTERGRUND_URL__", willkommenstext: "__WILLKOMMENSTEXT__" };</script>

<script>
(function() {
  const root = document.getElementById('kiosk-root');

  if (window.KIOSK_CONFIG.hintergrundUrl) {
    root.style.backgroundImage = `linear-gradient(rgba(27,36,48,0.55), rgba(27,36,48,0.78)), url('${window.KIOSK_CONFIG.hintergrundUrl}')`;
    root.style.backgroundSize = 'cover';
    root.style.backgroundPosition = 'center';
  }

  // --- Übersetzungen ---------------------------------------------------------

  const UEBERSETZUNGEN = {
    de: {
      empfang: 'Empfang', willkommen_default: 'Willkommen!',
      rolle_besucher_titel: 'Ich bin Besucher', rolle_besucher_sub: 'Neu anmelden',
      rolle_handwerker_titel: 'Ich bin Handwerker', rolle_handwerker_sub: 'Neu anmelden, ggf. mit Schlüssel',
      rolle_abmelden_titel: 'Ich möchte mich abmelden', rolle_abmelden_sub: 'Für bereits angemeldete Besucher & Handwerker',
      name_titel: 'Wie ist Ihr Name?', name_label: 'Vor- und Nachname', name_platzhalter: 'Max Mustermann',
      firma_titel: 'Für welche Firma sind Sie hier?', firma_label: 'Firma (optional)', firma_platzhalter: 'Firma GmbH',
      details_titel: 'Wen möchten Sie besuchen?', ansprechpartner_label: 'Ansprechperson', ansprechpartner_platzhalter: 'Name der Ansprechperson',
      grund_label: 'Grund des Besuchs (optional)', grund_platzhalter: 'z. B. Meeting, Lieferung',
      schluessel_frage_titel: 'Brauchen Sie einen Schlüssel?', ja: 'Ja', nein: 'Nein',
      schluessel_name_titel: 'Welchen Schlüssel benötigen Sie?', schluessel_label: 'Schlüssel / Objekt', schluessel_platzhalter: 'z. B. Keller, Raum 2.14',
      review_titel: 'Bitte prüfen', review_name: 'Name', review_firma: 'Firma', review_ansprechpartner: 'Ansprechperson',
      review_grund: 'Grund', review_schluessel: 'Schlüssel', review_schluessel_nicht_benoetigt: 'nicht benötigt',
      weiter: 'Weiter', zurueck: 'Zurück', absenden_besucher: 'Anmeldung abschicken', absenden_handwerker: 'Vorgang bestätigen',
      wird_gespeichert: 'Wird gespeichert…',
      fehler_name: 'Bitte Namen eingeben.', fehler_ansprechpartner: 'Bitte angeben, wen Sie besuchen möchten.',
      fehler_schluessel: 'Bitte Schlüssel bzw. Objekt angeben.', fehler_speichern: 'Speichern fehlgeschlagen. Bitte erneut versuchen oder am Empfang melden.',
      abmeldung_eyebrow: 'Abmeldung — {standort}', abmeldung_titel: 'Wer möchte sich abmelden?',
      abmeldung_suchen_platzhalter: 'Namen eingeben…', abmeldung_suche_hinweis: 'Bitte mindestens 2 Zeichen eingeben.',
      abmeldung_keine_treffer: 'Keine Treffer.', laedt: 'Lädt…',
      badge_besucher: 'Besucher', badge_handwerker: 'Handwerker',
      abmeldung_bestaetigen_titel: 'Auf Wiedersehen, {name}?', abmeldung_schluessel_zeile: 'Schlüssel',
      abmeldung_zurueckgeben_label: 'Schlüssel jetzt zurückgeben', abmeldung_btn: 'Abmelden',
      fehler_abmelden: 'Abmelden fehlgeschlagen. Bitte erneut versuchen oder am Empfang melden.',
      fertig_anmeldung_titel: 'Danke, {name}!', fertig_abmeldung_titel: 'Auf Wiedersehen, {name}!',
      fertig_besucher_text: 'Ihre Anmeldung wurde übermittelt.', fertig_handwerker_text: 'Ihre Anmeldung wurde erfasst.',
      fertig_abmeldung_text: 'Ihre Abmeldung wurde erfasst.'
    },
    en: {
      empfang: 'Reception', willkommen_default: 'Welcome!',
      rolle_besucher_titel: 'I am a visitor', rolle_besucher_sub: 'New check-in',
      rolle_handwerker_titel: 'I am a contractor', rolle_handwerker_sub: 'New check-in, with key if needed',
      rolle_abmelden_titel: 'I want to check out', rolle_abmelden_sub: 'For visitors & contractors already checked in',
      name_titel: 'What is your name?', name_label: 'Full name', name_platzhalter: 'Jane Smith',
      firma_titel: 'Which company are you here for?', firma_label: 'Company (optional)', firma_platzhalter: 'Company Ltd.',
      details_titel: 'Who are you visiting?', ansprechpartner_label: 'Contact person', ansprechpartner_platzhalter: 'Name of contact person',
      grund_label: 'Reason for visit (optional)', grund_platzhalter: 'e.g. meeting, delivery',
      schluessel_frage_titel: 'Do you need a key?', ja: 'Yes', nein: 'No',
      schluessel_name_titel: 'Which key do you need?', schluessel_label: 'Key / object', schluessel_platzhalter: 'e.g. basement, room 2.14',
      review_titel: 'Please review', review_name: 'Name', review_firma: 'Company', review_ansprechpartner: 'Contact person',
      review_grund: 'Reason', review_schluessel: 'Key', review_schluessel_nicht_benoetigt: 'not needed',
      weiter: 'Next', zurueck: 'Back', absenden_besucher: 'Submit check-in', absenden_handwerker: 'Confirm',
      wird_gespeichert: 'Saving…',
      fehler_name: 'Please enter a name.', fehler_ansprechpartner: 'Please specify who you are visiting.',
      fehler_schluessel: 'Please specify the key or object.', fehler_speichern: 'Saving failed. Please try again or contact reception.',
      abmeldung_eyebrow: 'Check-out — {standort}', abmeldung_titel: 'Who would like to check out?',
      abmeldung_suchen_platzhalter: 'Enter name…', abmeldung_suche_hinweis: 'Please enter at least 2 characters.',
      abmeldung_keine_treffer: 'No matches.', laedt: 'Loading…',
      badge_besucher: 'Visitor', badge_handwerker: 'Contractor',
      abmeldung_bestaetigen_titel: 'Goodbye, {name}?', abmeldung_schluessel_zeile: 'Key',
      abmeldung_zurueckgeben_label: 'Return key now', abmeldung_btn: 'Check out',
      fehler_abmelden: 'Check-out failed. Please try again or contact reception.',
      fertig_anmeldung_titel: 'Thank you, {name}!', fertig_abmeldung_titel: 'Goodbye, {name}!',
      fertig_besucher_text: 'Your check-in has been submitted.', fertig_handwerker_text: 'Your check-in has been recorded.',
      fertig_abmeldung_text: 'Your check-out has been recorded.'
    }
  };

  function t(schluessel, vars) {
    let text = (UEBERSETZUNGEN[state.sprache] && UEBERSETZUNGEN[state.sprache][schluessel]) || UEBERSETZUNGEN.de[schluessel] || schluessel;
    if (vars) Object.keys(vars).forEach(k => { text = text.replace(`{${k}}`, vars[k]); });
    return text;
  }

  function spracheSchalterHtml() {
    return `<div class="sprache-schalter">
      <button type="button" data-sprache="de" data-active="${state.sprache === 'de'}">DE</button>
      <button type="button" data-sprache="en" data-active="${state.sprache === 'en'}">EN</button>
    </div>`;
  }

  // Delegierter Listener: funktioniert nach jedem Re-Render weiter, da nur
  // die Kinder von #kiosk-root ersetzt werden, nicht das Element selbst.
  root.addEventListener('click', e => {
    const btn = e.target.closest('.sprache-schalter button');
    if (!btn) return;
    state.sprache = btn.dataset.sprache;
    render();
  });

  // --- Zustand -----------------------------------------------------------------

  function leererState() {
    return {
      sprache: 'de',
      rolle: null,
      stepIndex: 0,
      standort: window.KIOSK_CONFIG.standort,
      name: '', firma: '', ansprechpartner: '', grund: '',
      brauchtSchluessel: null, schluessel: '',
      suchbegriff: '', suchergebnisse: null, sucheLaedt: false,
      ausgewaehlt: null, schluesselZurueck: true,
      submitting: false, error: '', fertig: null
    };
  }
  let state = leererState();
  let suchTimer = null;
  let suchAnfrageId = 0;

  function currentSteps() {
    if (state.rolle === 'besucher') return ['name', 'firma', 'details', 'review'];
    if (state.rolle === 'handwerker') {
      const s = ['name', 'firma', 'schluessel-frage'];
      if (state.brauchtSchluessel === 'ja') s.push('schluessel-name');
      s.push('review');
      return s;
    }
    return [];
  }

  function render() {
    document.documentElement.lang = state.sprache;
    root.dataset.rolle = state.rolle || '';
    if (state.fertig) return renderFertig();
    if (state.rolle === 'abmelden') return renderAbmelden();
    if (!state.rolle) return renderStart();
    return renderWizard();
  }

  function cardShell(innerHtml) {
    root.innerHTML = `<div class="card">${innerHtml}</div>`;
  }

  function renderStart() {
    cardShell(`
      <div class="top">
        <div><p class="eyebrow">${t('empfang')} — ${escapeHtml(state.standort)}</p><h1 class="display">${escapeHtml(window.KIOSK_CONFIG.willkommenstext || t('willkommen_default'))}</h1></div>
        ${spracheSchalterHtml()}
      </div>
      <div class="rollen">
        <button type="button" class="rollen-btn" data-rolle="besucher">
          <span class="titel">${t('rolle_besucher_titel')}</span>
          <span class="sub">${t('rolle_besucher_sub')}</span>
        </button>
        <button type="button" class="rollen-btn" data-rolle="handwerker">
          <span class="titel">${t('rolle_handwerker_titel')}</span>
          <span class="sub">${t('rolle_handwerker_sub')}</span>
        </button>
        <button type="button" class="rollen-btn leise" data-rolle="abmelden">
          <span class="titel">${t('rolle_abmelden_titel')}</span>
          <span class="sub">${t('rolle_abmelden_sub')}</span>
        </button>
      </div>
    `);
    root.querySelectorAll('.rollen-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.rolle = btn.dataset.rolle;
        state.stepIndex = 0;
        render();
      });
    });
  }

  function fortschrittHtml(steps) {
    return `<div class="fortschritt">${steps.map((_, i) => `<div class="punkt" data-erledigt="${i <= state.stepIndex}"></div>`).join('')}</div>`;
  }

  function renderWizard() {
    const steps = currentSteps();
    if (state.stepIndex >= steps.length) state.stepIndex = steps.length - 1;
    const step = steps[state.stepIndex];

    let titel = '';
    let body = '';
    let weiterAktiv = true;
    let weiterText = t('weiter');
    let weiterAktion = 'weiter';

    if (step === 'name') {
      titel = t('name_titel');
      body = `<div><label for="f-name">${t('name_label')}</label><input id="f-name" value="${escapeAttr(state.name)}" placeholder="${t('name_platzhalter')}" autocomplete="off" /></div>`;
      weiterAktiv = !!state.name.trim();
    } else if (step === 'firma') {
      titel = t('firma_titel');
      body = `<div><label for="f-firma">${t('firma_label')}</label><input id="f-firma" value="${escapeAttr(state.firma)}" placeholder="${t('firma_platzhalter')}" autocomplete="off" /></div>`;
      weiterAktiv = true;
    } else if (step === 'details') {
      titel = t('details_titel');
      body = `
        <div><label for="f-ansprechpartner">${t('ansprechpartner_label')}</label><input id="f-ansprechpartner" value="${escapeAttr(state.ansprechpartner)}" placeholder="${t('ansprechpartner_platzhalter')}" autocomplete="off" /></div>
        <div><label for="f-grund">${t('grund_label')}</label><input id="f-grund" value="${escapeAttr(state.grund)}" placeholder="${t('grund_platzhalter')}" autocomplete="off" /></div>
      `;
      weiterAktiv = !!state.ansprechpartner.trim();
    } else if (step === 'schluessel-frage') {
      root.dataset.rolle = 'handwerker';
      cardShell(`
        <div class="top"><div>${fortschrittHtml(steps)}<h1 class="display" style="margin-top:8px">${t('schluessel_frage_titel')}</h1></div>${spracheSchalterHtml()}</div>
        <div class="wahl-row">
          <button type="button" id="btn-nein">${t('nein')}</button>
          <button type="button" id="btn-ja">${t('ja')}</button>
        </div>
        <div class="step-nav"><button type="button" class="zurueck-btn" id="btn-zurueck">${t('zurueck')}</button></div>
      `);
      root.querySelector('#btn-ja').addEventListener('click', () => { state.brauchtSchluessel = 'ja'; state.stepIndex++; render(); });
      root.querySelector('#btn-nein').addEventListener('click', () => { state.brauchtSchluessel = 'nein'; state.schluessel = ''; state.stepIndex++; render(); });
      root.querySelector('#btn-zurueck').addEventListener('click', () => goBack());
      return;
    } else if (step === 'schluessel-name') {
      titel = t('schluessel_name_titel');
      body = `<div><label for="f-schluessel">${t('schluessel_label')}</label><input id="f-schluessel" value="${escapeAttr(state.schluessel)}" placeholder="${t('schluessel_platzhalter')}" autocomplete="off" /></div>`;
      weiterAktiv = !!state.schluessel.trim();
    } else if (step === 'review') {
      titel = t('review_titel');
      const zeilen = [[t('review_name'), state.name], [t('review_firma'), state.firma || '—']];
      if (state.rolle === 'besucher') { zeilen.push([t('review_ansprechpartner'), state.ansprechpartner]); zeilen.push([t('review_grund'), state.grund || '—']); }
      if (state.rolle === 'handwerker') { zeilen.push([t('review_schluessel'), state.brauchtSchluessel === 'ja' ? state.schluessel : t('review_schluessel_nicht_benoetigt')]); }
      body = zeilen.map(([k, v]) => `<div class="review-zeile"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('');
      weiterText = state.submitting ? t('wird_gespeichert') : (state.rolle === 'besucher' ? t('absenden_besucher') : t('absenden_handwerker'));
      weiterAktion = 'absenden';
      weiterAktiv = !state.submitting;
    }

    cardShell(`
      <div class="top"><div>${fortschrittHtml(steps)}<h1 class="display" style="margin-top:8px">${titel}</h1></div>${spracheSchalterHtml()}</div>
      <form id="wizard-form" novalidate>${body}</form>
      <p class="error">${escapeHtml(state.error)}</p>
      <div class="step-nav">
        <button type="button" class="zurueck-btn" id="btn-zurueck">${t('zurueck')}</button>
        <button type="button" class="weiter-btn" id="btn-weiter" ${weiterAktiv ? '' : 'disabled'}>${weiterText}</button>
      </div>
    `);

    const nameInput = root.querySelector('#f-name');
    if (nameInput) nameInput.addEventListener('input', e => { state.name = e.target.value; syncWeiterButton(); });
    const firmaInput = root.querySelector('#f-firma');
    if (firmaInput) firmaInput.addEventListener('input', e => { state.firma = e.target.value; });
    const apInput = root.querySelector('#f-ansprechpartner');
    if (apInput) apInput.addEventListener('input', e => { state.ansprechpartner = e.target.value; syncWeiterButton(); });
    const grundInput = root.querySelector('#f-grund');
    if (grundInput) grundInput.addEventListener('input', e => { state.grund = e.target.value; });
    const schluesselInput = root.querySelector('#f-schluessel');
    if (schluesselInput) schluesselInput.addEventListener('input', e => { state.schluessel = e.target.value; syncWeiterButton(); });

    // Wichtig: verhindert, dass Enter im Eingabefeld das <form> nativ absendet
    // (das hätte einen vollständigen Seiten-Reload und Zurücksetzen des
    // Assistenten zur Folge). Enter löst stattdessen dieselbe Aktion wie der
    // "Weiter"-Button aus.
    root.querySelector('#wizard-form').addEventListener('submit', e => {
      e.preventDefault();
      weiterAktionAusfuehren(weiterAktion, weiterAktiv);
    });

    root.querySelector('#btn-zurueck').addEventListener('click', () => goBack());
    root.querySelector('#btn-weiter').addEventListener('click', () => weiterAktionAusfuehren(weiterAktion, weiterAktiv));
  }

  function weiterAktionAusfuehren(weiterAktion, weiterAktiv) {
    if (!weiterAktiv) return;
    if (weiterAktion === 'absenden') { submitAnmeldung(); return; }
    state.error = '';
    state.stepIndex++;
    render();
  }

  function syncWeiterButton() {
    const steps = currentSteps();
    const step = steps[state.stepIndex];
    const btn = root.querySelector('#btn-weiter');
    if (!btn) return;
    let aktiv = true;
    if (step === 'name') aktiv = !!state.name.trim();
    if (step === 'details') aktiv = !!state.ansprechpartner.trim();
    if (step === 'schluessel-name') aktiv = !!state.schluessel.trim();
    btn.disabled = !aktiv;
  }

  function goBack() {
    state.error = '';
    if (state.stepIndex > 0) { state.stepIndex--; render(); return; }
    const sprache = state.sprache;
    state = leererState();
    state.sprache = sprache;
    render();
  }

  async function submitAnmeldung() {
    state.submitting = true; state.error = ''; render();
    const endpoint = state.rolle === 'besucher' ? '/api/besucher' : '/api/handwerker';
    const body = { standort: state.standort, name: state.name.trim(), firma: state.firma.trim() || null };
    if (state.rolle === 'besucher') { body.ansprechpartner = state.ansprechpartner.trim(); body.grund = state.grund.trim() || null; }
    if (state.rolle === 'handwerker') { body.schluessel = state.brauchtSchluessel === 'ja' ? state.schluessel.trim() : null; }

    let ok = false, serverError = '';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': window.KIOSK_CONFIG.apiKey },
        body: JSON.stringify(body)
      });
      ok = res.ok;
      if (!ok) { const b = await res.json().catch(() => ({})); serverError = b.error || ''; }
    } catch (e) { ok = false; }

    if (!ok) {
      state.submitting = false;
      state.error = serverError || t('fehler_speichern');
      render();
      return;
    }

    const name = state.name.trim();
    const rolle = state.rolle;
    const sprache = state.sprache;
    state = leererState();
    state.sprache = sprache;
    state.fertig = { art: 'anmeldung', rolle, name };
    render();
  }

  // --- Abmeldung (Suche statt Vollliste, damit niemand sehen kann, wer im Haus ist) --

  function renderAbmelden() {
    if (!state.ausgewaehlt) {
      cardShell(`
        <div class="top">
          <div><p class="eyebrow">${t('abmeldung_eyebrow', { standort: state.standort })}</p><h1 class="display">${t('abmeldung_titel')}</h1></div>
          ${spracheSchalterHtml()}
        </div>
        <div class="suchfeld"><input type="text" id="such-input" value="${escapeAttr(state.suchbegriff)}" placeholder="${t('abmeldung_suchen_platzhalter')}" autocomplete="off" /></div>
        <div id="such-ergebnisse"></div>
        <div class="step-nav"><button type="button" class="zurueck-btn" id="btn-zurueck">${t('zurueck')}</button></div>
      `);
      const input = root.querySelector('#such-input');
      input.focus();
      input.addEventListener('input', e => {
        state.suchbegriff = e.target.value;
        clearTimeout(suchTimer);
        suchTimer = setTimeout(sucheAusloesen, 300);
        renderSuchErgebnisse();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(suchTimer); sucheAusloesen(); }
      });
      root.querySelector('#btn-zurueck').addEventListener('click', () => { const sprache = state.sprache; state = leererState(); state.sprache = sprache; render(); });
      renderSuchErgebnisse();
      return;
    }

    const hatOffenenSchluessel = state.ausgewaehlt.typ === 'handwerker' && !!state.ausgewaehlt.schluessel;
    cardShell(`
      <div class="top">
        <div><p class="eyebrow">${t('abmeldung_eyebrow', { standort: state.standort })}</p><h1 class="display">${t('abmeldung_bestaetigen_titel', { name: escapeHtml(state.ausgewaehlt.name) })}</h1></div>
        ${spracheSchalterHtml()}
      </div>
      <div class="step-body">
        ${hatOffenenSchluessel ? `
          <div class="review-zeile"><span>${t('abmeldung_schluessel_zeile')}</span><span>${escapeHtml(state.ausgewaehlt.schluessel)}</span></div>
          <div class="toggle-zeile"><input type="checkbox" id="chk-zurueck" ${state.schluesselZurueck ? 'checked' : ''} /><label for="chk-zurueck" style="margin:0">${t('abmeldung_zurueckgeben_label')}</label></div>
        ` : ''}
      </div>
      <p class="error">${escapeHtml(state.error)}</p>
      <div class="step-nav">
        <button type="button" class="zurueck-btn" id="btn-zurueck">${t('zurueck')}</button>
        <button type="button" class="weiter-btn" id="btn-bestaetigen">${state.submitting ? t('wird_gespeichert') : t('abmeldung_btn')}</button>
      </div>
    `);
    const chk = root.querySelector('#chk-zurueck');
    if (chk) chk.addEventListener('change', e => { state.schluesselZurueck = e.target.checked; });
    root.querySelector('#btn-zurueck').addEventListener('click', () => { state.ausgewaehlt = null; render(); });
    root.querySelector('#btn-bestaetigen').addEventListener('click', () => submitAbmeldung());
  }

  async function sucheAusloesen() {
    const anfrageId = ++suchAnfrageId;
    const begriff = state.suchbegriff.trim();
    if (begriff.length < 2) { state.suchergebnisse = null; renderSuchErgebnisse(); return; }
    state.sucheLaedt = true;
    renderSuchErgebnisse();
    let ergebnisse = [];
    try {
      const res = await fetch(`/api/checkins/suche?standort=${encodeURIComponent(state.standort)}&q=${encodeURIComponent(begriff)}`, {
        headers: { 'x-api-key': window.KIOSK_CONFIG.apiKey }
      });
      ergebnisse = res.ok ? await res.json() : [];
    } catch (e) { ergebnisse = []; }
    if (anfrageId !== suchAnfrageId) return; // veraltete Antwort ignorieren
    state.sucheLaedt = false;
    state.suchergebnisse = ergebnisse;
    renderSuchErgebnisse();
  }

  function renderSuchErgebnisse() {
    const container = root.querySelector('#such-ergebnisse');
    if (!container) return;
    if (state.suchbegriff.trim().length < 2) { container.innerHTML = `<p class="such-hinweis">${t('abmeldung_suche_hinweis')}</p>`; return; }
    if (state.sucheLaedt) { container.innerHTML = `<p class="such-hinweis">${t('laedt')}</p>`; return; }
    if (!state.suchergebnisse || !state.suchergebnisse.length) { container.innerHTML = `<p class="such-hinweis">${t('abmeldung_keine_treffer')}</p>`; return; }
    container.innerHTML = `<div class="liste">${state.suchergebnisse.map(e => `
      <button type="button" class="liste-item" data-id="${e.id}" data-typ="${e.typ}">
        <span><span class="n">${escapeHtml(e.name)}</span><br/><span class="s">${escapeHtml(e.firma || '—')}</span></span>
        <span class="badge">${e.typ === 'besucher' ? t('badge_besucher') : t('badge_handwerker')}</span>
      </button>
    `).join('')}</div>`;
    container.querySelectorAll('.liste-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const eintrag = state.suchergebnisse.find(e => String(e.id) === btn.dataset.id && e.typ === btn.dataset.typ);
        state.ausgewaehlt = eintrag;
        render();
      });
    });
  }

  async function submitAbmeldung() {
    state.submitting = true; state.error = ''; render();
    const { id, typ, name } = state.ausgewaehlt;
    let ok = false, serverError = '';
    try {
      const res = await fetch(`/api/checkins/${typ}/${id}/abmelden`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-api-key': window.KIOSK_CONFIG.apiKey },
        body: JSON.stringify({ standort: state.standort, schluessel_zurueck: state.schluesselZurueck })
      });
      ok = res.ok;
      if (!ok) { const b = await res.json().catch(() => ({})); serverError = b.error || ''; }
    } catch (e) { ok = false; }

    if (!ok) {
      state.submitting = false;
      state.error = serverError || t('fehler_abmelden');
      render();
      return;
    }

    const sprache = state.sprache;
    state = leererState();
    state.sprache = sprache;
    state.fertig = { art: 'abmeldung', name };
    render();
  }

  // --- Abschluss --------------------------------------------------------------

  function renderFertig() {
    const f = state.fertig;
    const titel = f.art === 'abmeldung' ? t('fertig_abmeldung_titel', { name: escapeHtml(f.name) }) : t('fertig_anmeldung_titel', { name: escapeHtml(f.name) });
    const text = f.art === 'abmeldung' ? t('fertig_abmeldung_text') : (f.rolle === 'besucher' ? t('fertig_besucher_text') : t('fertig_handwerker_text'));
    cardShell(`<div class="confirm"><div class="stamp">✓</div><h2 class="display">${titel}</h2><p>${text}</p></div>`);
    setTimeout(() => { const sprache = state.sprache; state = leererState(); state.sprache = sprache; render(); }, 4000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }

  render();
})();
</script>
</body>
</html>
