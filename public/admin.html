<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Besucher &amp; Schlüssel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #app, #app * { box-sizing: border-box; }
  #app {
    /* Dunkel = Standard, angelehnt an die Vorlage (sehr dunkler Hintergrund, Karten leicht heller, Amber-Akzent) */
    --bg: #0B0E14; --bg-sidebar: #10141C; --surface: #161B24; --surface-2: #1E2430;
    --text: #ECEFF4; --text-muted: #8E97AC; --border: #262D3B;
    --accent: #F0A63C; --accent-text: #241704; --accent-2: #3E7075; --accent-2-text: #EAF4F4;
    --danger: #E5484D; --danger-text: #fff; --ok: #34C77B;
    --pill-offen-bg: rgba(240,166,60,0.22); --pill-offen-text: #F0A63C;
    --pill-ausgabe-bg: rgba(62,112,117,0.30); --pill-ausgabe-text: #8FD3D9;
    --pill-rueckgabe-bg: rgba(255,255,255,0.09); --pill-rueckgabe-text: #B7BEC9;
    --card-shadow: 0 20px 45px -25px rgba(0,0,0,0.6);

    font-family: 'Inter', sans-serif; min-height: 100vh; background: var(--bg); color: var(--text);
    display: flex; transition: background 0.15s ease, color 0.15s ease;
  }
  #app[data-theme="light"] {
    --bg: #F2F3F6; --bg-sidebar: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F3F6;
    --text: #1B2430; --text-muted: #6B7280; --border: #E3E5EA;
    --accent: #D98E3D; --accent-text: #241704; --accent-2: #3E7075; --accent-2-text: #FFFFFF;
    --danger: #C0392B; --danger-text: #fff; --ok: #2F9E5D;
    --pill-offen-bg: rgba(217,142,61,0.16); --pill-offen-text: #B9701F;
    --pill-ausgabe-bg: rgba(62,112,117,0.16); --pill-ausgabe-text: #2C5257;
    --pill-rueckgabe-bg: rgba(91,99,110,0.12); --pill-rueckgabe-text: #5C6470;
    --card-shadow: 0 16px 32px -22px rgba(27,36,48,0.18);
  }

  #app .display { font-family: 'Space Grotesk', sans-serif; }
  #app h1 { font-size: 22px; margin: 0 0 18px 0; }
  #app h3 { font-size: 15px; margin: 0 0 10px 0; }
  #app .eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 4px 0; font-weight: 600; }

  #app .login-card { max-width: 380px; margin: 80px auto; background: var(--surface); color: var(--text);
    border-radius: 16px; padding: 28px; box-shadow: var(--card-shadow); border: 1px solid var(--border); }
  #app .login-card h2 { margin-top: 0; font-size: 19px; }
  #app input, #app select { padding: 11px 12px; border-radius: 9px; border: 1.5px solid var(--border);
    font-family: inherit; font-size: 14px; background: var(--surface); color: var(--text); }
  #app .login-card input { width: 100%; margin-bottom: 12px; }
  #app .btn { padding: 11px 16px; border-radius: 9px; border: none; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; color: var(--accent-text); background: var(--accent); }
  #app .btn.sekundaer { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }
  #app .btn.gefahr { background: var(--danger); color: var(--danger-text); }
  #app .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #app .error { color: var(--danger); font-size: 13px; min-height: 16px; margin: 4px 0; }
  #app .ok-msg { color: var(--ok); font-size: 13px; min-height: 16px; margin: 4px 0; }

  /* --- Sidebar --- */
  #app .sidebar { width: 246px; flex-shrink: 0; background: var(--bg-sidebar); border-right: 1px solid var(--border);
    padding: 20px 12px; display: flex; flex-direction: column; min-height: 100vh; }
  #app .sidebar-header { padding: 4px 10px 18px 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #app .sidebar-header .wer { font-weight: 700; font-size: 14px; margin-top: 2px; }
  #app .sidebar-header .wo { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  #app .theme-toggle { flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #app .theme-toggle svg { width: 16px; height: 16px; }
  #app .sidebar-gruppe { margin-bottom: 6px; }
  #app .sidebar-gruppe-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 10px 10px 6px 10px; }
  #app .sidebar-link { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; border: none;
    background: transparent; color: var(--text-muted); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 2px; }
  #app .sidebar-link svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.85; }
  #app .sidebar-link:hover { background: var(--surface-2); color: var(--text); }
  #app .sidebar-link[data-active="true"] { background: var(--accent); color: var(--accent-text); }
  #app .sidebar-link[data-active="true"] svg { opacity: 1; }
  #app .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  #app .main { flex: 1; padding: 30px 32px; min-width: 0; }

  @media (max-width: 860px) {
    #app { flex-direction: column; }
    #app .sidebar { width: 100%; min-height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; }
    #app .sidebar-header, #app .sidebar-footer { display: none; }
    #app .sidebar-gruppe { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 0; }
    #app .sidebar-gruppe-label { display: none; }
    #app .main { padding: 20px; }
  }

  #app .toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px 0; flex-wrap: wrap; }
  #app .toolbar label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  #app .toolbar select, #app .toolbar input { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  #app .standort-label { font-size: 13px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 7px; }
  #app .toolbar .refresh { margin-left: auto; background: transparent; border: 1.5px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-family: inherit; cursor: pointer; font-size: 13px; }

  #app table { width: 100%; border-collapse: collapse; background: var(--surface); color: var(--text); border-radius: 12px;
    overflow: hidden; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
  #app th, #app td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  #app th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  #app tr:last-child td { border-bottom: none; }
  #app .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  #app .pill.offen { background: var(--pill-offen-bg); color: var(--pill-offen-text); }
  #app .pill.ausgabe { background: var(--pill-ausgabe-bg); color: var(--pill-ausgabe-text); }
  #app .pill.rueckgabe { background: var(--pill-rueckgabe-bg); color: var(--pill-rueckgabe-text); }
  #app .action-btn { padding: 6px 11px; border-radius: 7px; border: none; font-family: inherit; font-size: 12px;
    font-weight: 700; cursor: pointer; color: var(--accent-text); background: var(--accent); margin-right: 4px; margin-bottom: 4px; }
  #app .action-btn.sekundaer { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }
  #app .action-btn.gefahr { background: var(--danger); color: var(--danger-text); }
  #app .empty { padding: 30px; text-align: center; color: var(--text-muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; font-size: 14px; }
  #app td input, #app td select { padding: 7px 8px; font-size: 13px; border-radius: 6px; }
  #app .actions-cell { white-space: nowrap; }

  #app .panel { background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
  #app .formzeile { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  #app .formzeile input, #app .formzeile select { flex: 1; min-width: 140px; }
  #app .karten-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  #app .standort-karte { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--card-shadow); }
  #app .standort-karte .vorschau { width: 100%; height: 90px; border-radius: 8px; background: var(--surface-2) center/cover no-repeat;
    margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
  #app .standort-karte .name { font-weight: 700; margin-bottom: 8px; }
  #app .standort-karte input[type="text"] { width: 100%; margin-bottom: 8px; }
  #app .hinweis { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function() {
  const app = document.getElementById('app');

  const ICON = {
    besucher: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>',
    handwerker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6.3 6.3 3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg>',
    schluessel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.6 12.4 20 3M17 6l3 3M14 9l2.5 2.5"/></svg>',
    schluesselkatalog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11H4z"/><path d="M9 4v6H4"/></svg>',
    export: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
    standorte: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    domains: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>',
    nutzer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21a5 5 0 0 0-10 0"/><circle cx="12" cy="10" r="3.5"/><path d="M21 21a4 4 0 0 0-3.2-3.9M16 6.2A3.5 3.5 0 0 1 17.5 13"/></svg>',
    kunden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    aktivitaet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
  };
  const ICON_SONNE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICON_MOND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';

  const OPERATIVE_TABS = [
    { id: 'besucher', label: 'Besucher', icon: ICON.besucher },
    { id: 'handwerker', label: 'Handwerker', icon: ICON.handwerker },
    { id: 'schluessel', label: 'Schlüssel-Log', icon: ICON.schluessel },
    { id: 'schluesselkatalog', label: 'Schlüssel-Katalog', icon: ICON.schluesselkatalog },
    { id: 'export', label: 'Export', icon: ICON.export }
  ];
  const VERWALTUNG_TABS = [
    { id: 'standorte', label: 'Standorte', icon: ICON.standorte },
    { id: 'domains', label: 'Domains', icon: ICON.domains },
    { id: 'nutzer', label: 'Nutzer', icon: ICON.nutzer },
    { id: 'kunden', label: 'Kunden', icon: ICON.kunden },
    { id: 'aktivitaet', label: 'Aktivität', icon: ICON.aktivitaet }
  ];
  const ALLE_TABS = [...OPERATIVE_TABS, ...VERWALTUNG_TABS];

  const state = {
    admin: null, checkingSession: true,
    theme: localStorage.getItem('dashboard_theme') === 'light' ? 'light' : 'dark',
    tab: 'besucher', onlyOpen: true, standort: '', standorte: [],
    von: '', bis: '',
    rows: [], loading: false, error: '', okMsg: '',
    editingId: null, editDraft: {},
    firmen: [], exportFirma: '', exportVon: '', exportBis: '', smtpKonfiguriert: false, exportBusy: false, exportMsg: '',
    kunden: [], nutzer: [], domains: [], auditLog: [],
    schluesselKatalog: [], katalogStandort: '', katalogNeuerName: ''
  };

  function themeUmschalten() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('dashboard_theme', state.theme);
    render();
  }

  function render() {
    app.dataset.theme = state.theme;
    if (state.checkingSession) { app.innerHTML = `<div class="empty" style="margin:80px auto;max-width:300px">Lädt…</div>`; return; }
    if (!state.admin) { renderLogin(); return; }
    renderDashboard();
  }

  async function init() {
    try {
      const res = await fetch('/api/admin/me');
      if (res.ok) state.admin = await res.json();
    } catch (e) {}
    state.checkingSession = false;
    render();
    if (state.admin) { await nachLogin(); }
  }

  async function nachLogin() {
    if (!state.admin.standort_id) await ladeStandorteListe();
    render();
    loadTabData();
  }

  async function ladeStandorteListe() {
    try {
      const res = await fetch('/api/dashboard/standorte');
      state.standorte = res.ok ? await res.json() : [];
    } catch (e) { state.standorte = []; }
  }

  function renderLogin() {
    app.innerHTML = `
      <div class="login-card">
        <p class="eyebrow">Dashboard</p>
        <h2 class="display">Anmelden</h2>
        <input id="user-input" type="text" placeholder="Benutzername" autocomplete="username" />
        <input id="pass-input" type="password" placeholder="Passwort" autocomplete="current-password" />
        <p class="error" id="login-error"></p>
        <button class="btn" id="login-btn">Anmelden</button>
      </div>
    `;
    app.querySelector('#login-btn').addEventListener('click', login);
    app.querySelector('#pass-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  }

  async function login() {
    const username = app.querySelector('#user-input').value.trim();
    const password = app.querySelector('#pass-input').value;
    const errorEl = app.querySelector('#login-error');
    if (!username || !password) { errorEl.textContent = 'Bitte Benutzername und Passwort eingeben.'; return; }
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errorEl.textContent = b.error || 'Anmeldung fehlgeschlagen.'; return; }
      state.admin = await res.json();
    } catch (e) { errorEl.textContent = 'Anmeldung fehlgeschlagen.'; return; }
    await nachLogin();
  }

  async function logout() {
    try { await fetch('/api/admin/logout', { method: 'POST' }); } catch (e) {}
    state.admin = null;
    render();
  }

  async function eigenesPasswortAendern() {
    const neu = prompt('Neues Passwort (mind. 8 Zeichen):');
    if (!neu) return;
    const res = await fetch('/api/admin/passwort', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ neuesPasswort: neu }) });
    const b = await res.json().catch(() => ({}));
    alert(res.ok ? 'Passwort wurde geändert.' : (b.error || 'Fehler beim Ändern.'));
  }

  function istSuperadmin() { return !state.admin.standort_id; }

  function renderDashboard() {
    const tabTitel = (ALLE_TABS.find(t => t.id === state.tab) || {}).label || '';
    app.innerHTML = `
      <div class="sidebar">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Dashboard</p>
            <div class="wer">${escapeHtml(state.admin.username)}</div>
            <div class="wo">${istSuperadmin() ? 'Superadmin — alle Standorte' : escapeHtml(state.admin.standort)}</div>
          </div>
          <button class="theme-toggle" id="theme-toggle" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">${state.theme === 'dark' ? ICON_SONNE : ICON_MOND}</button>
        </div>
        <div class="sidebar-gruppe">
          <div class="sidebar-gruppe-label">Betrieb</div>
          ${OPERATIVE_TABS.map(t => `<button class="sidebar-link" data-tab="${t.id}" data-active="${state.tab === t.id}">${t.icon}<span>${t.label}</span></button>`).join('')}
        </div>
        ${istSuperadmin() ? `
        <div class="sidebar-gruppe">
          <div class="sidebar-gruppe-label">Zentrale Verwaltung</div>
          ${VERWALTUNG_TABS.map(t => `<button class="sidebar-link" data-tab="${t.id}" data-active="${state.tab === t.id}">${t.icon}<span>${t.label}</span></button>`).join('')}
        </div>` : ''}
        <div class="sidebar-footer">
          <button class="sidebar-link" id="passwort-btn">Mein Passwort ändern</button>
          <button class="sidebar-link" id="logout-btn">Abmelden</button>
        </div>
      </div>
      <div class="main">
        <h1 class="display">${escapeHtml(tabTitel)}</h1>
        <div id="tab-content"></div>
      </div>
    `;
    app.querySelectorAll('.sidebar-link[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { state.tab = btn.dataset.tab; state.editingId = null; state.error = ''; state.okMsg = ''; render(); loadTabData(); });
    });
    app.querySelector('#theme-toggle').addEventListener('click', themeUmschalten);
    app.querySelector('#logout-btn').addEventListener('click', logout);
    app.querySelector('#passwort-btn').addEventListener('click', eigenesPasswortAendern);
    renderTabContent();
  }

  function loadTabData() {
    if (['besucher', 'handwerker', 'schluessel'].includes(state.tab)) return loadListe();
    if (state.tab === 'schluesselkatalog') return loadSchluesselKatalogTab();
    if (state.tab === 'export') return loadExportTab();
    if (state.tab === 'standorte') return loadStandorteTab();
    if (state.tab === 'domains') return loadDomainsTab();
    if (state.tab === 'nutzer') return loadNutzerTab();
    if (state.tab === 'kunden') return loadKundenTab();
    if (state.tab === 'aktivitaet') return loadAktivitaetTab();
  }

  function renderTabContent() {
    const c = app.querySelector('#tab-content');
    if (!c) return;
    if (['besucher', 'handwerker', 'schluessel'].includes(state.tab)) return renderOperativTab(c);
    if (state.tab === 'schluesselkatalog') return renderSchluesselKatalogTab(c);
    if (state.tab === 'export') return renderExportTab(c);
    if (state.tab === 'standorte') return renderStandorteTab(c);
    if (state.tab === 'domains') return renderDomainsTab(c);
    if (state.tab === 'nutzer') return renderNutzerTab(c);
    if (state.tab === 'kunden') return renderKundenTab(c);
    if (state.tab === 'aktivitaet') return renderAktivitaetTab(c);
  }

  // ===== Betrieb: Besucher / Handwerker / Schlüssel-Log (inkl. Verlauf) =====

  async function loadListe() {
    state.loading = true; state.editingId = null;
    renderTabContent();
    const endpoint = state.tab === 'besucher' ? '/api/besucher' : state.tab === 'handwerker' ? '/api/handwerker' : '/api/schluessel';
    const params = new URLSearchParams();
    if (state.onlyOpen) params.set('offen', 'true');
    if (istSuperadmin() && state.standort) params.set('standort', state.standort);
    if (!state.onlyOpen && state.von) params.set('von', state.von);
    if (!state.onlyOpen && state.bis) params.set('bis', state.bis);
    try {
      const res = await fetch(`${endpoint}?${params.toString()}`);
      if (res.status === 401) { state.admin = null; render(); return; }
      state.rows = await res.json();
      state.error = '';
    } catch (e) { state.error = 'Daten konnten nicht geladen werden.'; }
    state.loading = false;
    renderTabContent();
  }

  function standortFilterHtml() {
    return istSuperadmin()
      ? `<select id="standort-filter"><option value="">Alle Standorte</option>${state.standorte.map(s => `<option value="${escapeAttr(s.name)}" ${s.name === state.standort ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select>`
      : `<span class="standort-label">${escapeHtml(state.admin.standort)}</span>`;
  }

  function renderOperativTab(container) {
    const nurOffenLabel = state.tab === 'schluessel' ? 'nur offene Schlüssel' : 'nur anwesende';
    container.innerHTML = `
      <div class="toolbar">
        <label><input type="checkbox" id="only-open" ${state.onlyOpen ? 'checked' : ''}/> ${nurOffenLabel}</label>
        ${standortFilterHtml()}
        ${!state.onlyOpen ? `
          <label>von <input type="date" id="verlauf-von" value="${escapeAttr(state.von)}" /></label>
          <label>bis <input type="date" id="verlauf-bis" value="${escapeAttr(state.bis)}" /></label>
        ` : ''}
        <button class="refresh" id="refresh-btn">Aktualisieren</button>
      </div>
      ${!state.onlyOpen ? '<p class="hinweis" style="margin:-8px 0 14px 0">Verlauf vergangener Einträge — Häkchen oben setzen, um nur aktuell Anwesende zu sehen.</p>' : ''}
      <div id="table-container"></div>
    `;
    container.querySelector('#only-open').addEventListener('change', e => { state.onlyOpen = e.target.checked; loadListe(); });
    const sf = container.querySelector('#standort-filter');
    if (sf) sf.addEventListener('change', e => { state.standort = e.target.value; loadListe(); });
    const vonEl = container.querySelector('#verlauf-von');
    if (vonEl) vonEl.addEventListener('change', e => { state.von = e.target.value; loadListe(); });
    const bisEl = container.querySelector('#verlauf-bis');
    if (bisEl) bisEl.addEventListener('change', e => { state.bis = e.target.value; loadListe(); });
    container.querySelector('#refresh-btn').addEventListener('click', loadListe);
    renderListeTabelle();
  }

  function renderListeTabelle() {
    const container = app.querySelector('#table-container');
    if (!container) return;
    if (state.loading) { container.innerHTML = `<div class="empty">Lädt…</div>`; return; }
    if (state.error) { container.innerHTML = `<div class="empty">${escapeHtml(state.error)}</div>`; return; }
    if (!state.rows.length) { container.innerHTML = `<div class="empty">Keine Einträge.</div>`; return; }
    if (state.tab === 'besucher') return renderBesucherTabelle(container);
    if (state.tab === 'handwerker') return renderHandwerkerTabelle(container);
    return renderSchluesselTabelle(container);
  }

  function renderBesucherTabelle(container) {
    container.innerHTML = `
      <table>
        <thead><tr><th>Standort</th><th>Name</th><th>Firma</th><th>Ansprechpartner</th><th>Grund</th><th>Angemeldet</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${state.rows.map(r => state.editingId === r.id ? `
            <tr>
              <td>${escapeHtml(r.standort)}</td>
              <td><input data-feld="name" value="${escapeAttr(state.editDraft.name ?? '')}" /></td>
              <td><input data-feld="firma" value="${escapeAttr(state.editDraft.firma ?? '')}" /></td>
              <td><input data-feld="ansprechpartner" value="${escapeAttr(state.editDraft.ansprechpartner ?? '')}" /></td>
              <td><input data-feld="grund" value="${escapeAttr(state.editDraft.grund ?? '')}" /></td>
              <td>${formatTime(r.angemeldet_um)}</td>
              <td>${r.abgemeldet_um ? 'abgemeldet' : '<span class="pill offen">anwesend</span>'}</td>

            <tr>
              <td>${escapeHtml(r.standort)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.firma || '—')}</td>
              <td>${escapeHtml(r.ansprechpartner)}</td><td>${escapeHtml(r.grund || '—')}</td><td>${formatTime(r.angemeldet_um)}</td>
              <td>${r.abgemeldet_um ? 'abgemeldet' : '<span class="pill offen">anwesend</span>'}</td>
              <td class="actions-cell"><button class="action-btn sekundaer" data-edit="${r.id}">Bearbeiten</button>${r.abgemeldet_um ? '' : `<button class="action-btn" data-abmelden="${r.id}">Abmelden</button>`}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    bindZeilenAktionen(container, 'besucher', ['name', 'firma', 'ansprechpartner', 'grund']);
  }

  function renderHandwerkerTabelle(container) {
    container.innerHTML = `
      <table>
        <thead><tr><th>Standort</th><th>Name</th><th>Firma</th><th>Schlüssel</th><th>Angemeldet</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${state.rows.map(r => state.editingId === r.id ? `
            <tr>
              <td>${escapeHtml(r.standort)}</td>
              <td><input data-feld="name" value="${escapeAttr(state.editDraft.name ?? '')}" /></td>
              <td><input data-feld="firma" value="${escapeAttr(state.editDraft.firma ?? '')}" /></td>
              <td><input data-feld="schluessel" value="${escapeAttr(state.editDraft.schluessel ?? '')}" /></td>
              <td>${formatTime(r.angemeldet_um)}</td>

              <td class="actions-cell"><button class="action-btn" data-save="${r.id}">Speichern</button><button class="action-btn sekundaer" data-cancel="1">Abbrechen</button></td>
            </tr>` : `
            <tr>
              <td>${escapeHtml(r.standort)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.firma || '—')}</td>
              <td>${escapeHtml(r.schluessel || '—')}</td><td>${formatTime(r.angemeldet_um)}</td>

              <td class="actions-cell"><button class="action-btn sekundaer" data-edit="${r.id}">Bearbeiten</button>${r.abgemeldet_um ? '' : `<button class="action-btn" data-abmelden="${r.id}">Abmelden</button>`}</td>
            </tr>`).join('')}
        </tbody>
      </table>

  function renderSchluesselTabelle(container) {
    container.innerHTML = `
      <table>
        <thead><tr><th>Standort</th><th>Schlüssel</th><th>Name</th><th>Firma</th><th>Vorgang</th><th>Zeitpunkt</th><th></th></tr></thead>
        <tbody>
          ${state.rows.map(r => `
            <tr>
              <td>${escapeHtml(r.standort)}</td><td>${escapeHtml(r.schluessel)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.firma || '—')}</td>
              <td><span class="pill ${r.richtung}">${r.richtung === 'ausgabe' ? 'ausgegeben' : 'zurückgegeben'}</span></td>
              <td>${formatTime(r.zeitpunkt)}</td>
              <td class="actions-cell">
                ${r.hat_unterschrift ? `<button class="action-btn sekundaer" data-unterschrift="${r.id}">Unterschrift ansehen</button>` : ''}
                ${(r.richtung === 'ausgabe' && state.onlyOpen) ? `<button class="action-btn" data-zurueckgeben="${r.id}">Zurückgeben</button>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    container.querySelectorAll('[data-zurueckgeben]').forEach(btn => {
      btn.addEventListener('click', async () => { await fetch(`/api/schluessel/${btn.dataset.zurueckgeben}/zurueckgeben`, { method: 'PATCH' }); loadListe(); });
    });
    container.querySelectorAll('[data-unterschrift]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const res = await fetch(`/api/schluessel/${btn.dataset.unterschrift}/unterschrift`);
        if (!res.ok) { alert('Unterschrift konnte nicht geladen werden.'); return; }
        const body = await res.json();
        const fenster = window.open('', '_blank', 'width=460,height=280');
        if (fenster) fenster.document.write(`<title>Unterschrift</title><body style="margin:0;display:flex;align-items:center;justify-content:center;background:#F4F0E6"><img src="${body.unterschrift}" style="max-width:100%;height:auto" /></body>`);
      });
    });
  }

  function bindZeilenAktionen(container, typ, editFelder) {
    container.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = state.rows.find(r => r.id === Number(btn.dataset.edit));
        state.editingId = row.id;
        state.editDraft = {};
        editFelder.forEach(f => { state.editDraft[f] = row[f] || ''; });
        renderListeTabelle();
      });
    });
    container.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', () => { state.editingId = null; renderListeTabelle(); }));
    container.querySelectorAll('[data-save]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const body = {};
        btn.closest('tr').querySelectorAll('input[data-feld]').forEach(input => { body[input.dataset.feld] = input.value; });
        await fetch(`/api/${typ}/${btn.dataset.save}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        state.editingId = null;
        loadListe();
      });
    });
    container.querySelectorAll('[data-abmelden]').forEach(btn => {
      btn.addEventListener('click', async () => { await fetch(`/api/${typ}/${btn.dataset.abmelden}/abmelden`, { method: 'PATCH' }); loadListe(); });
    });
  }

  // ===== Export ==============================================================

  async function loadExportTab() {
    try {
      const [firmenRes, smtpRes] = await Promise.all([
        fetch(`/api/export/firmen${istSuperadmin() && state.standort ? '?standort=' + encodeURIComponent(state.standort) : ''}`),
        fetch('/api/smtp-status')
      ]);
      state.firmen = firmenRes.ok ? await firmenRes.json() : [];
      state.smtpKonfiguriert = smtpRes.ok ? (await smtpRes.json()).konfiguriert : false;
    } catch (e) { state.firmen = []; }
    renderTabContent();
  }

  function renderExportTab(container) {
    container.innerHTML = `
      <div class="panel">
        <h3>Schlüssel-Übersicht exportieren</h3>
        <div class="formzeile">
          ${istSuperadmin() ? `<select id="ex-standort"><option value="">Standort wählen…</option>${state.standorte.map(s => `<option value="${escapeAttr(s.name)}" ${s.name === state.standort ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select>` : `<span class="standort-label">${escapeHtml(state.admin.standort)}</span>`}
          <select id="ex-firma"><option value="">Alle Firmen</option>${state.firmen.map(f => `<option value="${escapeAttr(f)}" ${f === state.exportFirma ? 'selected' : ''}>${escapeHtml(f)}</option>`).join('')}</select>
          <input type="date" id="ex-von" value="${escapeAttr(state.exportVon)}" />
          <input type="date" id="ex-bis" value="${escapeAttr(state.exportBis)}" />
        </div>
        <div class="formzeile">
          <button class="btn" id="ex-download">CSV herunterladen</button>
          <button class="btn sekundaer" id="ex-senden" ${state.smtpKonfiguriert ? '' : 'disabled'}>Per E-Mail an Kunde senden</button>
        </div>
        ${state.smtpKonfiguriert ? '' : '<p class="hinweis">E-Mail-Versand ist nicht konfiguriert (SMTP_*-Variablen fehlen) — nur CSV-Download verfügbar.</p>'}
        <p class="error">${escapeHtml(state.exportMsg && !state.exportMsg.startsWith('OK:') ? state.exportMsg : '')}</p>
        <p class="ok-msg">${escapeHtml(state.exportMsg && state.exportMsg.startsWith('OK:') ? state.exportMsg.slice(3) : '')}</p>
      </div>
    `;
    const standortSel = container.querySelector('#ex-standort');
    if (standortSel) standortSel.addEventListener('change', e => { state.standort = e.target.value; loadExportTab(); });
    container.querySelector('#ex-firma').addEventListener('change', e => { state.exportFirma = e.target.value; });
    container.querySelector('#ex-von').addEventListener('change', e => { state.exportVon = e.target.value; });
    container.querySelector('#ex-bis').addEventListener('change', e => { state.exportBis = e.target.value; });
    container.querySelector('#ex-download').addEventListener('click', exportDownload);
    container.querySelector('#ex-senden').addEventListener('click', exportSenden);
  }

  function exportDownload() {
    const standort = istSuperadmin() ? state.standort : state.admin.standort;
    if (!standort) { state.exportMsg = 'Bitte zuerst einen Standort wählen.'; renderTabContent(); return; }
    const params = new URLSearchParams();
    if (istSuperadmin()) params.set('standort', standort);
    if (state.exportFirma) params.set('firma', state.exportFirma);
    if (state.exportVon) params.set('von', state.exportVon);
    if (state.exportBis) params.set('bis', state.exportBis);
    window.open(`/api/export/schluessel?${params.toString()}`, '_blank');
  }

  async function exportSenden() {
    const standort = istSuperadmin() ? state.standort : state.admin.standort;
    if (!standort) { state.exportMsg = 'Bitte zuerst einen Standort wählen.'; renderTabContent(); return; }
    state.exportBusy = true; state.exportMsg = '';
    renderTabContent();
    try {
      const res = await fetch('/api/export/schluessel/senden', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ standort, firma: state.exportFirma || undefined, von: state.exportVon || undefined, bis: state.exportBis || undefined })
      });
      const body = await res.json().catch(() => ({}));
      state.exportMsg = res.ok ? `OK:Gesendet an ${body.email}.` : (body.error || 'Senden fehlgeschlagen.');
    } catch (e) { state.exportMsg = 'Senden fehlgeschlagen.'; }
    state.exportBusy = false;
    renderTabContent();
  }

  // ===== Schlüssel-Katalog =====================================================

  async function loadSchluesselKatalogTab() {
    if (istSuperadmin() && !state.standorte.length) await ladeStandorteListe();
    const standort = istSuperadmin() ? state.katalogStandort : state.admin.standort;
    if (!standort) { state.schluesselKatalog = []; renderTabContent(); return; }
    try {
      const res = await fetch(`/api/dashboard/schluessel-katalog${istSuperadmin() ? '?standort=' + encodeURIComponent(standort) : ''}`);
      state.schluesselKatalog = res.ok ? await res.json() : [];
    } catch (e) { state.schluesselKatalog = []; }
    renderTabContent();
  }

  function renderSchluesselKatalogTab(container) {
    const standort = istSuperadmin() ? state.katalogStandort : state.admin.standort;
    container.innerHTML = `
      <div class="panel">
        <h3>Auswählbare Schlüssel für diesen Standort</h3>
        <div class="formzeile">
          ${istSuperadmin() ? `<select id="sk-standort"><option value="">Standort wählen…</option>${state.standorte.map(s => `<option value="${escapeAttr(s.name)}" ${s.name === state.katalogStandort ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select>` : `<span class="standort-label">${escapeHtml(state.admin.standort)}</span>`}
        </div>
        ${standort ? `
        <div class="formzeile">
          <input type="text" id="sk-name" placeholder="z. B. Keller, Raum 2.14" />
          <button class="btn" id="sk-anlegen">Anlegen</button>
        </div>` : '<p class="hinweis">Bitte zuerst einen Standort wählen.</p>'}
        <p class="error" id="sk-error"></p>
      </div>
      ${standort ? (state.schluesselKatalog.length ? `
      <table>
        <thead><tr><th>Schlüssel</th><th>Angelegt</th><th></th></tr></thead>
        <tbody>
          ${state.schluesselKatalog.map(k => `<tr><td>${escapeHtml(k.name)}</td><td>${formatTime(k.erstellt_um)}</td><td><button class="action-btn gefahr" data-delete-katalog="${k.id}">Löschen</button></td></tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty">Noch keine Schlüssel für diesen Standort hinterlegt.</div>') : ''}
    `;
    const standortSel = container.querySelector('#sk-standort');
    if (standortSel) standortSel.addEventListener('change', e => { state.katalogStandort = e.target.value; loadSchluesselKatalogTab(); });
    const anlegenBtn = container.querySelector('#sk-anlegen');
    if (anlegenBtn) anlegenBtn.addEventListener('click', async () => {
      const name = container.querySelector('#sk-name').value.trim();
      const errEl = container.querySelector('#sk-error');
      if (!name) { errEl.textContent = 'Bitte einen Namen eingeben.'; return; }
      const body = { name };
      if (istSuperadmin()) body.standort = state.katalogStandort;
      const res = await fetch('/api/dashboard/schluessel-katalog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errEl.textContent = b.error || 'Fehler beim Anlegen.'; return; }
      errEl.textContent = '';
      loadSchluesselKatalogTab();
    });
    container.querySelectorAll('[data-delete-katalog]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Diesen Schlüssel wirklich aus dem Katalog löschen?')) return;
        await fetch(`/api/dashboard/schluessel-katalog/${btn.dataset.deleteKatalog}`, { method: 'DELETE' });
        loadSchluesselKatalogTab();
      });
    });
  }

  // ===== Standorte (inkl. Kiosk-Design) ======================================

  async function loadStandorteTab() {
    await ladeStandorteListe();
    renderTabContent();
  }

  function renderStandorteTab(container) {
    container.innerHTML = `
      <div class="panel">
        <h3>Neuen Standort anlegen</h3>
        <div class="formzeile">
          <input type="text" id="st-name" placeholder="Name des Standorts" />
          <button class="btn" id="st-anlegen">Anlegen</button>
        </div>
        <p class="error" id="st-error"></p>
      </div>
      <div class="karten-grid">
        ${state.standorte.map(s => `
          <div class="standort-karte" data-id="${s.id}">
            <div class="vorschau" ${s.hintergrund_dateiname ? `style="background-image:url('/uploads/${s.hintergrund_dateiname}')"` : ''}>${s.hintergrund_dateiname ? '' : 'Kein Kiosk-Hintergrund'}</div>
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="hinweis">${s.domain_anzahl} Domain(s) · ${s.nutzer_anzahl} Nutzer</div>
            <input type="text" data-willkommenstext="${s.id}" placeholder="Willkommenstext (optional)" value="${escapeAttr(s.willkommenstext || '')}" />
            <div class="formzeile" style="margin-bottom:6px">
              <button class="action-btn sekundaer" data-save-text="${s.id}">Text speichern</button>
              <label class="btn sekundaer" style="cursor:pointer;margin:0">
                Bild wählen <input type="file" accept="image/png,image/jpeg,image/webp" data-upload="${s.id}" style="display:none" />
              </label>
              ${s.hintergrund_dateiname ? `<button class="action-btn sekundaer" data-remove-bg="${s.id}">Bild entfernen</button>` : ''}
              <button class="action-btn gefahr" data-delete="${s.id}">Löschen</button>
            </div>
            <p class="error" data-fehler="${s.id}"></p>
          </div>
        `).join('')}
      </div>
    `;
    container.querySelector('#st-anlegen').addEventListener('click', async () => {
      const name = container.querySelector('#st-name').value.trim();
      const errEl = container.querySelector('#st-error');
      if (!name) { errEl.textContent = 'Bitte einen Namen eingeben.'; return; }
      const res = await fetch('/api/dashboard/standorte', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errEl.textContent = b.error || 'Fehler beim Anlegen.'; return; }
      errEl.textContent = '';
      loadStandorteTab();
    });

    container.querySelectorAll('[data-save-text]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.saveText;
        const willkommenstext = container.querySelector(`[data-willkommenstext="${id}"]`).value;
        await fetch(`/api/dashboard/standorte/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ willkommenstext }) });
        loadStandorteTab();
      });
    });

    container.querySelectorAll('[data-upload]').forEach(input => {
      input.addEventListener('change', async () => {
        const id = input.dataset.upload;
        const fehlerEl = container.querySelector(`[data-fehler="${id}"]`);
        if (!input.files.length) return;
        const formData = new FormData();
        formData.append('bild', input.files[0]);
        const res = await fetch(`/api/dashboard/standorte/${id}/hintergrund`, { method: 'POST', body: formData });
        if (!res.ok) { const b = await res.json().catch(() => ({})); fehlerEl.textContent = b.error || 'Upload fehlgeschlagen.'; return; }
        loadStandorteTab();
      });
    });

    container.querySelectorAll('[data-remove-bg]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Hintergrundbild entfernen?')) return;
        await fetch(`/api/dashboard/standorte/${btn.dataset.removeBg}/hintergrund`, { method: 'DELETE' }); loadStandorteTab();
      });
    });

    container.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Diesen Standort wirklich löschen?')) return;
        const id = btn.dataset.delete;
        const fehlerEl = container.querySelector(`[data-fehler="${id}"]`);
        const res = await fetch(`/api/dashboard/standorte/${id}`, { method: 'DELETE' });
        if (!res.ok) { const b = await res.json().catch(() => ({})); fehlerEl.textContent = b.error || 'Löschen fehlgeschlagen.'; return; }
        loadStandorteTab();
      });
    });
  }

  // ===== Domains ==============================================================

  async function loadDomainsTab() {
    if (!state.standorte.length) await ladeStandorteListe();
    try {
      const res = await fetch('/api/dashboard/domains');
      state.domains = res.ok ? await res.json() : [];
    } catch (e) { state.domains = []; }
    renderTabContent();
  }

  function renderDomainsTab(container) {
    container.innerHTML = `
      <div class="panel">
        <h3>Domain einem Standort zuordnen</h3>
        <div class="formzeile">
          <input type="text" id="dm-host" placeholder="z. B. hauptgebaeude.example.com" />

        </div>
        <p class="error" id="dm-error"></p>

      </div>
      ${state.domains.length ? `
      <table>
        <thead><tr><th>Hostname</th><th>Standort</th><th>Angelegt</th><th></th></tr></thead>

    `;
    container.querySelector('#dm-anlegen').addEventListener('click', async () => {
      const hostname = container.querySelector('#dm-host').value.trim();
      const standort_id = container.querySelector('#dm-standort').value;
      const errEl = container.querySelector('#dm-error');
      const res = await fetch('/api/dashboard/domains', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hostname, standort_id }) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errEl.textContent = b.error || 'Fehler beim Anlegen.'; return; }
      errEl.textContent = '';
      loadDomainsTab();
    });
    container.querySelectorAll('[data-delete-domain]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Diese Domain-Zuordnung wirklich entfernen?')) return;
        await fetch(`/api/dashboard/domains/${btn.dataset.deleteDomain}`, { method: 'DELETE' }); loadDomainsTab();
      });
    });
  }

  // ===== Nutzer ================================================================

  async function loadNutzerTab() {
    if (!state.standorte.length) await ladeStandorteListe();
    try {
      const res = await fetch('/api/dashboard/nutzer');
      state.nutzer = res.ok ? await res.json() : [];
    } catch (e) { state.nutzer = []; }
    renderTabContent();
  }

  function renderNutzerTab(container) {
    container.innerHTML = `
      <div class="panel">
        <h3>Neuen Zugang anlegen</h3>
        <div class="formzeile">
          <input type="text" id="nu-user" placeholder="Benutzername" />
          <input type="password" id="nu-pass" placeholder="Passwort (mind. 8 Zeichen)" />
          <select id="nu-standort"><option value="">Alle Standorte (Superadmin)</option>${state.standorte.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select>
          <button class="btn" id="nu-anlegen">Anlegen</button>
        </div>
        <p class="error" id="nu-error"></p>
      </div>
      <table>
        <thead><tr><th>Benutzername</th><th>Zugriff</th><th>Angelegt</th><th></th></tr></thead>
        <tbody>
          ${state.nutzer.map(n => `
            <tr>
              <td>${escapeHtml(n.username)}</td>
              <td>${n.standort_name ? escapeHtml(n.standort_name) : '<span class="pill offen">Alle Standorte</span>'}</td>
              <td>${formatTime(n.erstellt_um)}</td>
              <td class="actions-cell">
                <button class="action-btn sekundaer" data-reset="${n.id}">Passwort setzen</button>
                <button class="action-btn gefahr" data-delete-nutzer="${n.id}">Löschen</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    container.querySelector('#nu-anlegen').addEventListener('click', async () => {
      const username = container.querySelector('#nu-user').value.trim();
      const password = container.querySelector('#nu-pass').value;
      const standort_id = container.querySelector('#nu-standort').value || null;
      const errEl = container.querySelector('#nu-error');
      const res = await fetch('/api/dashboard/nutzer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, standort_id }) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errEl.textContent = b.error || 'Fehler beim Anlegen.'; return; }
      errEl.textContent = '';
      loadNutzerTab();
    });
    container.querySelectorAll('[data-reset]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const neu = prompt('Neues Passwort (mind. 8 Zeichen):');
        if (!neu) return;
        const res = await fetch(`/api/dashboard/nutzer/${btn.dataset.reset}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: neu }) });
        if (!res.ok) { const b = await res.json().catch(() => ({})); alert(b.error || 'Fehler.'); }
      });
    });
    container.querySelectorAll('[data-delete-nutzer]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Diesen Zugang wirklich löschen?')) return;
        const res = await fetch(`/api/dashboard/nutzer/${btn.dataset.deleteNutzer}`, { method: 'DELETE' });
        if (!res.ok) { const b = await res.json().catch(() => ({})); alert(b.error || 'Fehler.'); return; }
        loadNutzerTab();
      });
    });
  }

  // ===== Kunden ================================================================

  async function loadKundenTab() {
    try {
      const res = await fetch('/api/dashboard/kunden');
      state.kunden = res.ok ? await res.json() : [];
    } catch (e) { state.kunden = []; }
    renderTabContent();
  }

  function renderKundenTab(container) {
    container.innerHTML = `
      <div class="panel">
        <h3>Kunden-Kontakt für Exporte hinterlegen</h3>
        <p class="hinweis" style="margin-top:-4px">Firma muss exakt so geschrieben sein wie bei den Schlüssel-Einträgen, damit der Export sie automatisch findet.</p>
        <div class="formzeile">
          <input type="text" id="ku-firma" placeholder="Firma" />
          <input type="email" id="ku-email" placeholder="E-Mail" />
          <input type="text" id="ku-notiz" placeholder="Notiz (optional)" />
          <button class="btn" id="ku-anlegen">Anlegen</button>
        </div>
        <p class="error" id="ku-error"></p>
      </div>
      ${state.kunden.length ? `
      <table>
        <thead><tr><th>Firma</th><th>E-Mail</th><th>Notiz</th><th></th></tr></thead>
        <tbody>
          ${state.kunden.map(k => `<tr><td>${escapeHtml(k.firma)}</td><td>${escapeHtml(k.email || '—')}</td><td>${escapeHtml(k.notiz || '—')}</td><td class="actions-cell"><button class="action-btn sekundaer" data-edit-kunde="${k.id}">Bearbeiten</button><button class="action-btn gefahr" data-delete-kunde="${k.id}">Löschen</button></td></tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty">Noch keine Kunden hinterlegt.</div>'}
    `;
    container.querySelector('#ku-anlegen').addEventListener('click', async () => {
      const firma = container.querySelector('#ku-firma').value.trim();
      const email = container.querySelector('#ku-email').value.trim();
      const notiz = container.querySelector('#ku-notiz').value.trim();
      const errEl = container.querySelector('#ku-error');
      const res = await fetch('/api/dashboard/kunden', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ firma, email, notiz }) });
      if (!res.ok) { const b = await res.json().catch(() => ({})); errEl.textContent = b.error || 'Fehler beim Anlegen.'; return; }
      errEl.textContent = '';
      loadKundenTab();
    });
    container.querySelectorAll('[data-edit-kunde]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const kunde = state.kunden.find(k => k.id === Number(btn.dataset.editKunde));
        const neueEmail = prompt(`E-Mail für ${kunde.firma}:`, kunde.email || '');
        if (neueEmail === null) return;
        const neueNotiz = prompt(`Notiz für ${kunde.firma}:`, kunde.notiz || '');
        if (neueNotiz === null) return;
        await fetch(`/api/dashboard/kunden/${kunde.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: neueEmail, notiz: neueNotiz }) });
        loadKundenTab();
      });
    });
    container.querySelectorAll('[data-delete-kunde]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Diesen Kunden wirklich löschen?')) return;
        await fetch(`/api/dashboard/kunden/${btn.dataset.deleteKunde}`, { method: 'DELETE' }); loadKundenTab();
      });
    });
  }

  // ===== Aktivität (Audit-Log) ================================================

  async function loadAktivitaetTab() {
    try {
      const res = await fetch('/api/dashboard/audit-log');
      state.auditLog = res.ok ? await res.json() : [];
    } catch (e) { state.auditLog = []; }
    renderTabContent();
  }

  function renderAktivitaetTab(container) {
    container.innerHTML = state.auditLog.length ? `
      <table>
        <thead><tr><th>Zeitpunkt</th><th>Benutzer</th><th>Aktion</th><th>Detail</th></tr></thead>
        <tbody>
          ${state.auditLog.map(a => `<tr><td>${formatTime(a.zeitpunkt)}</td><td>${escapeHtml(a.username)}</td><td>${escapeHtml(a.aktion)}</td><td>${escapeHtml(a.detail || '—')}</td></tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty">Noch keine Aktivität protokolliert.</div>';
  }

  // ===== Hilfsfunktionen =======================================================

  function formatTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }

  init();
})();
</script>
</body>
</html>
